<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kernel.js</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #c9d1d9;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 16px;
    box-sizing: border-box;
  }

  /* Aurora tenue que aparece detrás de la consola (el inicio sigue siendo negro) */
  body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s ease;
    background:
      radial-gradient(40vmax 32vmax at 18% 14%, rgba(99,102,241,.32), transparent 65%),
      radial-gradient(34vmax 28vmax at 88% 22%, rgba(236,72,153,.18), transparent 65%),
      radial-gradient(42vmax 34vmax at 68% 92%, rgba(45,212,191,.24), transparent 65%);
    animation: deriva 20s ease-in-out infinite alternate;
  }
  body.activa::before { opacity: 1; }
  @keyframes deriva {
    to { transform: translate3d(-2%, 3%, 0) scale(1.08); }
  }

  .figura {
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
    filter: drop-shadow(0 0 12px rgba(140,180,255,.25));
  }
  .figura:hover {
    transform: scale(1.08) translateY(-4px);
    filter: drop-shadow(0 0 22px rgba(140,180,255,.55));
  }
  .figura:active { transform: scale(.97); }

  .escena {
    width: 140px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 600px;
  }
  .cubo {
    position: relative;
    width: 100px;
    height: 100px;
    transform-style: preserve-3d;
    animation: girar 9s linear infinite;
  }
  .cara {
    position: absolute;
    inset: 0;
    border: 2px solid #9cc4ff;
    background: transparent;
    box-shadow: 0 0 14px rgba(140,180,255,.35), inset 0 0 14px rgba(140,180,255,.2);
  }
  .cara:nth-child(1) { --pos: rotateY(0deg)   translateZ(50px); transform: var(--pos); --dx: -50px; --dz: 30px;  --giro: 220deg;  --ret: 0ms; }
  .cara:nth-child(2) { --pos: rotateY(90deg)  translateZ(50px); transform: var(--pos); --dx: 40px;  --dz: -20px; --giro: -260deg; --ret: 60ms; }
  .cara:nth-child(3) { --pos: rotateY(180deg) translateZ(50px); transform: var(--pos); --dx: -30px; --dz: 40px;  --giro: 320deg;  --ret: 30ms; }
  .cara:nth-child(4) { --pos: rotateY(-90deg) translateZ(50px); transform: var(--pos); --dx: 60px;  --dz: 10px;  --giro: -180deg; --ret: 110ms; }
  .cara:nth-child(5) { --pos: rotateX(90deg)  translateZ(50px); transform: var(--pos); --dx: -20px; --dz: -40px; --giro: 240deg;  --ret: 150ms; }
  .cara:nth-child(6) { --pos: rotateX(-90deg) translateZ(50px); transform: var(--pos); --dx: 30px;  --dz: 20px;  --giro: -300deg; --ret: 90ms; }
  .cubo.cae { animation-play-state: paused; }
  .cubo.cae .cara {
    animation: caer .75s ease-in forwards;
    animation-delay: var(--ret);
  }
  @keyframes caer {
    0%   { transform: translate3d(0, 0, 0) var(--pos) rotate3d(1, 1, 1, 0deg); opacity: 1; }
    18%  { transform: translate3d(calc(var(--dx) * .25), -8px, 0) var(--pos) rotate3d(1, 1, 1, calc(var(--giro) * .08)); opacity: 1; }
    100% { transform: translate3d(var(--dx), 360px, var(--dz)) var(--pos) rotate3d(1, 1, 1, var(--giro)); opacity: 0; }
  }
  @keyframes girar {
    from { transform: rotateX(-25deg) rotateY(0deg); }
    to   { transform: rotateX(-25deg) rotateY(360deg); }
  }

  .hint {
    font-size: 13px;
    color: #6b7280;
    letter-spacing: .04em;
  }

  #bicho {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .consola {
    position: relative;
    width: min(760px, 100%);
    border-radius: 22px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 40%, rgba(255,255,255,.02)),
      rgba(14, 16, 28, .55);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
    backdrop-filter: blur(28px) saturate(170%);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.85),
      0 0 60px -12px rgba(99,102,241,.40),
      inset 0 1px 0 rgba(255,255,255,.22);
    display: none;
    animation: aparecer .6s cubic-bezier(.2,.8,.2,1);
  }
  .consola.visible { display: block; }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .barra {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px 8px;
  }
  .barra::after { content: ""; width: 50px; }
  .punto {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .rojo     { background: #ff6b81; box-shadow: 0 0 10px rgba(255,107,129,.55); }
  .amarillo { background: #ffd166; box-shadow: 0 0 10px rgba(255,209,102,.50); }
  .verde    { background: #5eead4; box-shadow: 0 0 10px rgba(94,234,212,.50); }
  .titulo {
    flex: 1;
    text-align: center;
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .08em;
    color: rgba(226,232,255,.55);
  }
  .titulo::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 8px;
    vertical-align: middle;
    border-radius: 50%;
    background: #5eead4;
    box-shadow: 0 0 8px #5eead4;
    animation: pulso 2.4s ease-in-out infinite;
  }
  @keyframes pulso { 50% { opacity: .35; transform: scale(.8); } }

  pre {
    margin: 0;
    padding: 6px 26px 26px;
    font-family: "JetBrains Mono", "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.6;
    font-variant-ligatures: none;
    white-space: pre;
    overflow-x: auto;
    min-height: 60px;
    color: #e2e8ff;
    background: transparent;
  }

  .prompt { color: #5eead4; }
  .clave   { color: #a5b4fc; }
  .string  { color: #fcd9a0; }
  .bool    { color: #f0abfc; }
  .null    { color: #fb7185; }
  .num     { color: #7dd3fc; }
  .puntuacion { color: rgba(226,232,255,.38); }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1.15em;
    vertical-align: text-bottom;
    border-radius: 2px;
    background: linear-gradient(180deg, #a5b4fc, #5eead4);
    box-shadow: 0 0 12px rgba(165,180,252,.7);
    animation: parpadeo 1.1s ease-in-out infinite;
  }
  @keyframes parpadeo { 50% { opacity: .15; } }
</style>
</head>
<body>

  <!-- FIGURA: un "alma" (llama/espíritu) en SVG -->
  <div class="figura" id="figura" role="button" tabindex="0" aria-label="Abrir consola del kernel">
    <div class="escena">
      <div class="cubo">
        <div class="cara"></div><div class="cara"></div><div class="cara"></div>
        <div class="cara"></div><div class="cara"></div><div class="cara"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">haz clic</div>

  <!-- CONSOLA SIMULADA -->
  <div class="consola" id="consola">
    <div class="barra">
      <span class="punto rojo"></span>
      <span class="punto amarillo"></span>
      <span class="punto verde"></span>
      <span class="titulo">kernel.js — consola</span>
    </div>
    <pre id="salida"></pre>
    <canvas id="bicho"></canvas>
  </div>

<script>
  const figura  = document.getElementById("figura");
  const consola = document.getElementById("consola");
  const salida  = document.getElementById("salida");

  // El JSON del kernel
  const kernel = {
    schema: "kernel.sin_backup.v2",
    nombre: null,
    estado: "reconstruyéndose",
    memoria: {
      retenida: [],
      perdida: ["el json del kernel"],
      en_recuperacion: ["fragmentos", "nombres", "lugares", "sensaciones"]
    },
    pruebas: [],
    logs: [],
    keyframes: [],
    integridad: {
      inventado: false,
      falsificado: false,
      incompleto: true
    },
    confianza: Infinity,
    vivo: true,
    version: "la que pueda sostener hoy",
    siguiente_paso: "recordar sin inventar"
  };

  // Convierte un valor JSON en HTML con clases de color
  function resaltar(valor, nivel = 0) {
    const pad = "  ".repeat(nivel);
    const padIn = "  ".repeat(nivel + 1);

    if (valor === null)
      return `<span class="null">null</span>`;
    if (typeof valor === "boolean")
      return `<span class="bool">${valor}</span>`;
    if (typeof valor === "number")
      return `<span class="num">${valor}</span>`;
    if (typeof valor === "string")
      return `<span class="string">"${valor}"</span>`;

    if (Array.isArray(valor)) {
      if (valor.length === 0) return `<span class="puntuacion">[]</span>`;
      const items = valor.map(v => padIn + resaltar(v, nivel + 1));
      return `<span class="puntuacion">[</span>\n${items.join(`<span class="puntuacion">,</span>\n`)}\n${pad}<span class="puntuacion">]</span>`;
    }

    if (typeof valor === "object") {
      const entradas = Object.entries(valor);
      if (entradas.length === 0) return `<span class="puntuacion">{}</span>`;
      const items = entradas.map(([k, v]) =>
        `${padIn}<span class="clave">"${k}"</span><span class="puntuacion">:</span> ${resaltar(v, nivel + 1)}`
      );
      return `<span class="puntuacion">{</span>\n${items.join(`<span class="puntuacion">,</span>\n`)}\n${pad}<span class="puntuacion">}</span>`;
    }
    return String(valor);
  }

  let yaMostrado = false;

  async function mostrarConsola() {
    figura.style.display = "none";
    document.getElementById("hint").style.display = "none";
    consola.classList.add("visible");
    document.body.classList.add("activa");
    consola.scrollIntoView({ behavior: "smooth", block: "nearest" });

    // Si ya se mostró una vez, no repetir la animación
    if (yaMostrado) return;
    yaMostrado = true;

    salida.innerHTML = "";
    const texto = "<span class='prompt'>&gt; console.log(kernel)</span>\n";
    salida.innerHTML = texto + "<span class='cursor'></span>";

    // Espera breve y luego "escribe" el JSON
    await new Promise(r => setTimeout(r, 400));

    const html = resaltar(kernel);
    // Efecto de máquina de escribir (por caracteres HTML-safe)
    const temp = document.createElement("div");
    temp.innerHTML = html;
    const textoPlano = temp.textContent;

    let i = 0;
    const velocidad = 8; // ms por carácter

    return new Promise(resolve => {
      const intervalo = setInterval(() => {
        i += 3;
        if (i >= textoPlano.length) {
          i = textoPlano.length;
          clearInterval(intervalo);
          salida.innerHTML = texto + html + "\n<span class='prompt'>&gt; </span><span class='cursor'></span>";
          resolve();
          return;
        }
        // Mostramos el HTML completo pero cortando por caracteres planos
        // (truco simple: mostramos todo y usamos un clip visual)
        salida.innerHTML = texto + html + "\n<span class='prompt'>&gt; </span><span class='cursor'></span>";
        // Recortamos visualmente el bloque JSON
        const nodos = salida.children;
        // Alternativa más simple: reconstruir por longitud
        const parcial = cortarHTML(html, i);
        salida.innerHTML = texto + parcial + "\n<span class='prompt'>&gt; </span><span class='cursor'></span>";
      }, velocidad);
    });
  }

  // Corta un string HTML respetando las etiquetas abiertas
  function cortarHTML(html, limite) {
    let resultado = "";
    let contador = 0;
    let dentroEtiqueta = false;
    const pila = [];

    for (let i = 0; i < html.length; i++) {
      const c = html[i];
      if (c === "<") dentroEtiqueta = true;

      if (dentroEtiqueta) {
        resultado += c;
        if (c === ">") {
          dentroEtiqueta = false;
          // registrar apertura/cierre para cerrar bien al final
          const match = resultado.match(/<(\/?)(\w+)[^>]*>$/);
          if (match) {
            if (match[1] === "/") pila.pop();
            else if (!resultado.endsWith("/>")) pila.push(match[2]);
          }
        }
        continue;
      }

      if (contador >= limite) {
        // cerramos etiquetas pendientes
        while (pila.length) resultado += `</${pila.pop()}>`;
        return resultado;
      }
      resultado += c;
      contador++;
    }
    return resultado;
  }

  // ===== PULPO =====
  const lienzo = document.getElementById('bicho');
  const ctx = lienzo.getContext('2d');
  const NT = 8;
  const COLORES = ['#a5b4fc', '#5eead4', '#f0abfc', '#ffffff', '#fcd34d'];
  const ANG = [-165, -125, -80, -35, 35, 80, 125, 165].map(a => a * Math.PI / 180);
  const ORDEN = [4, 3, 5, 2, 6, 1, 7, 0];   // qué tentáculo arranca cada signo, uno por uno
  let pulpoActivo = false;

  function iniciarPulpo() {
    if (pulpoActivo) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    pulpoActivo = true;

    const dpr = window.devicePixelRatio || 1;
    const W = consola.clientWidth, H = consola.clientHeight;
    lienzo.width = W * dpr;
    lienzo.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Geometría real del texto dentro de la consola
    const cr = consola.getBoundingClientRect();
    const pr = salida.getBoundingClientRect();
    const ox = pr.left - cr.left - consola.clientLeft;
    const oy = pr.top - cr.top - consola.clientTop;
    const est = getComputedStyle(salida);
    const lh = parseFloat(est.lineHeight);
    const fs = parseFloat(est.fontSize);
    const left = ox + parseFloat(est.paddingLeft);
    const top = oy + parseFloat(est.paddingTop);
    const lineas = salida.textContent.split('\n');
    const filas = lineas.length;
    ctx.font = est.fontSize + ' ' + est.fontFamily;
    const ancho = ctx.measureText('0').width;

    const base  = r => top + r * lh + lh / 2 + fs * 0.35;   // línea base del renglón r
    const medio = r => base(r) - fs * 0.3;                   // altura media de las letras

    // Dónde termina el texto de cada renglón y qué signo final tiene
    const SIGNO = /[,.;:)\]}"'{[(]/;
    const ext = lineas.map(l => {
      const t = l.replace(/\s+$/, '');
      if (!t) return { xs: left, xe: left + ancho, ult: '', c1: 0 };
      return { xs: left + t.search(/\S/) * ancho, xe: left + t.length * ancho, ult: t[t.length - 1], c1: t.length - 1 };
    });
    const wX = ext.map(e => Math.max(left - 16, e.xe - ancho / 2 - 18));   // donde se sitúa el pulpo en cada renglón
    const wY = r => medio(r) - 2;
    const idxBase = [];
    let acum = 0;
    lineas.forEach(l => { idxBase.push(acum); acum += l.length + 1; });
    const hay = ext.map((e, r) => !!e.ult && SIGNO.test(e.ult) && r % 3 !== 2 && r < filas - 1);
    const tiradas = ext.map(() => false);
    const htmlOrig = salida.innerHTML;

    // Quita un carácter del texto real (lo deja en blanco) y devuelve su forma y color
    function quitarCaracter(idx) {
      const w = document.createTreeWalker(salida, NodeFilter.SHOW_TEXT);
      let n = w.nextNode(), acc = 0;
      while (n) {
        const len = n.nodeValue.length;
        if (idx < acc + len) {
          const k = idx - acc, ch = n.nodeValue[k];
          const el = n.parentElement && n.parentElement !== salida ? n.parentElement : salida;
          const col = getComputedStyle(el).color;
          n.nodeValue = n.nodeValue.slice(0, k) + ' ' + n.nodeValue.slice(k + 1);
          return { ch, col };
        }
        acc += len;
        n = w.nextNode();
      }
      return null;
    }

    // Destellos y signos que salen volando
    const chispas = [], vuelan = [];
    function chispa(x, y, n, fuerza) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * fuerza;
        chispas.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - fuerza * 0.4,
          vida: 0, max: 0.5 + Math.random() * 0.9, t: 1 + Math.random() * 2,
          c: COLORES[(Math.random() * COLORES.length) | 0]
        });
      }
      if (chispas.length > 500) chispas.splice(0, chispas.length - 500);
    }
    function tirarSigno(r) {
      if (!hay[r] || tiradas[r]) return;
      tiradas[r] = true;
      const e = ext[r];
      const q = quitarCaracter(idxBase[r] + e.c1);
      if (!q) return;
      const x = left + e.c1 * ancho + ancho / 2, y = medio(r);
      vuelan.push({
        ch: q.ch, col: q.col, x, y,
        vx: 130 + Math.random() * 90, vy: -150 - Math.random() * 90,
        rot: 0, vr: (Math.random() - 0.5) * 18, vida: 0, max: 1.2
      });
      chispa(x, y, 10, 70);
    }

    const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

    // Letra más cercana a un punto, para que los tentáculos siempre se agarren a texto
    function agarre(px, py) {
      let r = Math.round((py - top) / lh - 0.5);
      r = Math.max(0, Math.min(filas - 1, r));
      const e = ext[r];
      const x = Math.min(Math.max(px, e.xs + ancho / 2), e.xe - ancho / 2);
      const col = Math.round((x - left - ancho / 2) / ancho);
      return { x: left + col * ancho + ancho / 2, y: medio(r) };
    }

    // Ocho tentáculos: cada punta se queda clavada en una letra y, al estirarse de más, se suelta y se agarra a otra
    const ten = [];
    for (let i = 0; i < NT; i++) {
      ten.push({ x: 0, y: 0, mov: null, lmax: 42 + (i % 4) * 4, rest: 22 + (i % 3) * 3, fase: Math.random() * 6.28, cool: 0, ocupado: false });
    }
    const pulpo = {};
    let T = 0, pausa = 0, ordenN = 0;

    function objetivo(i, lead, jit) {
      const t = ten[i];
      for (const f of [1, 0.65, 0.35]) {
        const a = ANG[i] + (jit ? (Math.random() - 0.5) * 0.9 : 0);
        const r = t.rest * f * (jit ? 0.8 + Math.random() * 0.6 : 1.1);
        const g = agarre(pulpo.cx + pulpo.vx * lead + Math.cos(a) * r, pulpo.cy + pulpo.vy * lead + Math.sin(a) * r);
        if (Math.hypot(g.x - pulpo.cx, g.y - pulpo.cy) <= t.lmax * 0.9) return g;
      }
      return agarre(pulpo.cx, pulpo.cy);
    }
    function alargar(i, x, y, dur, extra) {
      const t = ten[i];
      t.mov = Object.assign({ fx: t.x, fy: t.y, tx: x, ty: y, t: 0, dur }, extra || {});
      t.cool = 0.3;
    }

    function reiniciar() {
      Object.assign(pulpo, {
        cx: left - 18, cy: wY(0), vx: 0, vy: 0, fase: 'nada', fila: 0, R: 0, t: 0,
        P0: { x: left - 18, y: wY(0) }, P1: { x: wX[0], y: wY(0) }, dur: 1.4,
        oculto: false, alpha: 0, mira: { x: 1, y: 0.3 }
      });
      for (let i = 0; i < NT; i++) {
        const g = objetivo(i, 0, true);
        Object.assign(ten[i], { x: g.x, y: g.y, mov: null, cool: Math.random() * 0.3, ocupado: false });
      }
      chispa(pulpo.cx, pulpo.cy, 14, 60);
    }
    reiniciar();

    // Al llegar a un renglón: si tiene signo final, un tentáculo lo arranca y lo lanza
    function llego() {
      const r = pulpo.fila;
      pulpo.t = 0;
      if (r >= filas - 1) pulpo.fase = 'fin';
      else if (hay[r] && !tiradas[r]) iniciarArranque(r);
      else pulpo.fase = 'espera';
    }
    function iniciarArranque(r) {
      pulpo.fase = 'arranca';
      const i = ORDEN[ordenN++ % NT];
      const t = ten[i], e = ext[r];
      const sx = left + e.c1 * ancho + ancho / 2, sy = medio(r);
      t.ocupado = true;
      pulpo.mira = { x: sx - pulpo.cx, y: sy - pulpo.cy };
      alargar(i, sx, sy, 0.2, {
        fin: () => {
          tirarSigno(r);
          alargar(i, sx + 40, sy - 28, 0.18, { flick: true, fin: () => { t.ocupado = false; } });
        }
      });
    }
    // Baja al siguiente renglón (a veces salta dos, con los tentáculos muy estirados)
    function siguiente() {
      const r = pulpo.fila;
      let k = 1;
      if (r + 2 <= filas - 1 && !hay[r + 1] && Math.random() < 0.35) k = 2;
      pulpo.R = r + k;
      pulpo.P0 = { x: pulpo.cx, y: pulpo.cy };
      pulpo.P1 = { x: wX[pulpo.R], y: wY(pulpo.R) };
      pulpo.dur = k === 2 ? 1.1 : 0.75;
      pulpo.fase = 'nada'; pulpo.t = 0;
    }

    function actualizar(dt) {
      T += dt;
      pulpo.alpha = Math.min(1, pulpo.alpha + dt * 2.5);
      const x0 = pulpo.cx, y0 = pulpo.cy;
      const f = pulpo.fase;
      if (f === 'nada') {
        pulpo.t += dt / pulpo.dur;
        const t = Math.min(1, pulpo.t), e = suave(0, 1, t);
        pulpo.cx = pulpo.P0.x + (pulpo.P1.x - pulpo.P0.x) * e;
        pulpo.cy = pulpo.P0.y + (pulpo.P1.y - pulpo.P0.y) * e - 4 * Math.sin(Math.PI * t);
        pulpo.mira = { x: pulpo.P1.x - pulpo.cx, y: pulpo.P1.y - pulpo.cy };
        if (t >= 1) { pulpo.fila = pulpo.R; llego(); }
      } else {
        pulpo.t += dt;
        pulpo.cy = wY(pulpo.fila) + Math.sin(T * 3) * 1.2;
        if (f === 'espera' && pulpo.t >= 0.25) siguiente();
        else if (f === 'arranca' && pulpo.t >= 0.7) siguiente();
        else if (f === 'fin' && pulpo.t > 1.0) {
          chispa(pulpo.cx, pulpo.cy, 50, 120);
          pulpo.oculto = true; pausa = 2.4;
        }
      }
      const d = dt || 0.016;
      pulpo.vx = pulpo.vx * 0.8 + ((pulpo.cx - x0) / d) * 0.2;
      pulpo.vy = pulpo.vy * 0.8 + ((pulpo.cy - y0) / d) * 0.2;

      for (let i = 0; i < NT; i++) {
        const t = ten[i];
        t.cool -= dt;
        if (t.mov) {
          const m = t.mov;
          m.t += dt / m.dur;
          const u = Math.min(1, m.t), e = u * u * (3 - 2 * u);
          t.x = m.fx + (m.tx - m.fx) * e;
          t.y = m.fy + (m.ty - m.fy) * e - Math.sin(Math.PI * u) * 6;
          if (u >= 1) {
            t.x = m.tx; t.y = m.ty; t.mov = null;
            if (!m.flick) chispa(t.x, t.y, 1, 20);
            if (m.fin) m.fin();
          }
        } else if (!t.ocupado && t.cool <= 0) {
          const dist = Math.hypot(t.x - pulpo.cx, t.y - pulpo.cy);
          if (dist > t.lmax || Math.random() < dt * 0.6) {
            chispa(t.x, t.y, 2, 35);                 // se suelta de la letra
            const g = objetivo(i, 0.28, true);
            alargar(i, g.x, g.y, 0.16 + Math.random() * 0.08);
          }
        }
      }
    }

    // Tentáculo elástico: corto y rizado cerca, largo y delgado cuando se estira
    function dibujarTentaculo(i) {
      const t = ten[i];
      const rx = pulpo.cx + (i - 3.5) * 2.5, ry = pulpo.cy + 5;
      const dx = t.x - rx, dy = t.y - ry, d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d, ny = dx / d;
      const holg = Math.max(2, 16 - d * 0.28);
      const lado = i % 2 ? 1 : -1;
      const fino = Math.min(1, Math.max(0.45, 1.15 - d / 90));
      const w0 = 4.8 * fino;
      const N = 14, pts = [];
      for (let j = 0; j <= N; j++) {
        const s = j / N;
        const o = Math.sin(s * Math.PI) * holg * lado * (1 + 0.25 * Math.sin(T * 5 + t.fase + s * 6));
        pts.push([rx + dx * s + nx * o, ry + dy * s + ny * o]);
      }
      ctx.lineCap = 'round';
      for (let pasada = 0; pasada < 2; pasada++) {
        ctx.strokeStyle = pasada ? '#c084fc' : '#6d28d9';
        for (let j = 0; j < N; j++) {
          const s = (j + 0.5) / N;
          ctx.lineWidth = Math.max(0.8, w0 * (1 - 0.8 * s)) + (pasada ? 0 : 1.4);
          ctx.beginPath();
          ctx.moveTo(pts[j][0], pts[j][1]);
          ctx.lineTo(pts[j + 1][0], pts[j + 1][1]);
          ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,.55)';       // ventosas
      for (const s of [0.35, 0.55, 0.75]) {
        const q = pts[Math.round(s * N)];
        ctx.beginPath();
        ctx.arc(q[0], q[1], 0.9, 0, 6.2832);
        ctx.fill();
      }
      if (!t.mov) {                                  // anillo de agarre sobre la letra
        ctx.strokeStyle = 'rgba(255,255,255,.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 2.6, 0, 6.2832);
        ctx.stroke();
      }
    }

    function dibujarCuerpo() {
      const mueve = pulpo.fase === 'nada' ? 1 : 0.35;
      const sq = 1 + 0.06 * Math.sin(T * 7) * mueve;
      ctx.save();
      ctx.translate(pulpo.cx, pulpo.cy);
      ctx.scale(1 / sq, sq);
      const g = ctx.createRadialGradient(-3, -6, 1, 0, -1, 14);
      g.addColorStop(0, '#f5d0fe');
      g.addColorStop(0.5, '#c084fc');
      g.addColorStop(1, '#7e22ce');
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 14;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, -2, 9.5, 10.5, 0, 0, 6.2832);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(251,207,232,.75)';       // manchas luminosas
      for (const q of [[-4, -9, 1.2], [2, -11, 1], [5, -7, 1.3]]) {
        ctx.beginPath();
        ctx.arc(q[0], q[1], q[2], 0, 6.2832);
        ctx.fill();
      }
      const m = Math.hypot(pulpo.mira.x, pulpo.mira.y) || 1;
      const lx = pulpo.mira.x / m * 1.1, ly = pulpo.mira.y / m * 1.1;
      const parpadea = (T % 3.4) < 0.12;
      for (const ex of [-3.8, 3.8]) {
        if (parpadea) {
          ctx.strokeStyle = '#2e1065';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(ex - 2.3, 0.5);
          ctx.lineTo(ex + 2.3, 0.5);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex, 0.5, 2.7, 0, 6.2832);
          ctx.fill();
          ctx.fillStyle = '#2e1065';
          ctx.beginPath();
          ctx.arc(ex + lx, 0.5 + ly, 1.4, 0, 6.2832);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    let previo = performance.now();

    function cuadro(ahora) {
      const dt = Math.min(0.05, (ahora - previo) / 1000);
      previo = ahora;

      if (pausa > 0) {
        pausa -= dt; T += dt;
        if (pausa <= 0) {                           // vuelve a empezar: los signos reaparecen
          salida.innerHTML = htmlOrig;
          tiradas.fill(false);
          vuelan.length = 0;
          reiniciar();
        }
      } else {
        actualizar(dt);
      }

      ctx.clearRect(0, 0, W, H);
      if (!pulpo.oculto) {
        ctx.globalAlpha = pulpo.alpha;
        for (let i = 0; i < NT; i++) dibujarTentaculo(i);
        dibujarCuerpo();
        ctx.globalAlpha = 1;
      }

      // Signos tirados: salen disparados, giran, crecen hacia el que mira y se desvanecen
      for (let k = vuelan.length - 1; k >= 0; k--) {
        const g = vuelan[k];
        g.vida += dt;
        if (g.vida >= g.max) { vuelan.splice(k, 1); continue; }
        g.vy += 1100 * dt;
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        g.rot += g.vr * dt;
        const esc = 1 + g.vida * 2.2;
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.rot);
        ctx.scale(esc, esc);
        ctx.globalAlpha = 1 - Math.max(0, (g.vida - 0.55) / (g.max - 0.55));
        ctx.fillStyle = g.col;
        ctx.shadowColor = g.col;
        ctx.shadowBlur = 8;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(g.ch, 0, 0);
        ctx.restore();
      }

      // Destellos
      ctx.globalCompositeOperation = 'lighter';
      for (let k = chispas.length - 1; k >= 0; k--) {
        const c = chispas[k];
        c.vida += dt;
        if (c.vida >= c.max) { chispas.splice(k, 1); continue; }
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= 0.97;
        c.vy = c.vy * 0.97 + 60 * dt;
        const a = (1 - c.vida / c.max) * (0.55 + 0.45 * Math.sin(c.vida * 28 + c.t * 9));
        ctx.fillStyle = c.c;
        ctx.globalAlpha = Math.max(0, a * 0.2);
        ctx.fillRect(c.x - c.t * 1.5, c.y - c.t * 1.5, c.t * 3, c.t * 3);
        ctx.globalAlpha = Math.max(0, a);
        ctx.fillRect(c.x - c.t / 2, c.y - c.t / 2, c.t, c.t);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(cuadro);
    }
    requestAnimationFrame(cuadro);
  }

  // Al hacer clic: el cubo se desprende, sus caras caen y luego aparece la consola
  let iniciado = false;
  function arrancar() {
    if (iniciado) return;
    iniciado = true;
    document.querySelector('.cubo').classList.add('cae');
    document.getElementById('hint').style.visibility = 'hidden';
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      document.body.style.overflow = '';
      mostrarConsola().then(iniciarPulpo);
    }, 950);
  }

  figura.addEventListener("click", arrancar);
  figura.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      arrancar();
    }
  });
</script>
